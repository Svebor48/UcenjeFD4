<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciklična Matrica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <div class="vertical-title">ULAZ</div>
            <div class="form-group">
                <label for="rows">Broj redaka (2 - 50)</label>
                <input type="number" id="rows" min="2" max="50" value="5">

                <label for="cols">Broj stupaca (2 - 50)</label>
                <input type="number" id="cols" min="2" max="50" value="5">

                <label for="pattern">Smjer i kretanje</label>
                <select id="pattern">
                    <optgroup label="Van prema unutra (Kazaljka na satu)">
                        <option value="1" selected>1. Dolje desno -> U smjeru kazaljke</option>
                        <option value="2">2. Dolje lijevo -> U smjeru kazaljke</option>
                        <option value="3">3. Gore lijevo -> U smjeru kazaljke</option>
                        <option value="4">4. Gore desno -> U smjeru kazaljke</option>
                    </optgroup>
                    <optgroup label="Van prema unutra (Suprotno od kazaljke)">
                        <option value="5">5. Dolje desno -> Kontra kazaljke</option>
                        <option value="6">6. Dolje lijevo -> Kontra kazaljke</option>
                        <option value="7">7. Gore lijevo -> Kontra kazaljke</option>
                        <option value="8">8. Gore desno -> Kontra kazaljke</option>
                    </optgroup>
                    <optgroup label="Sredina prema van (Kazaljka na satu)">
                        <option value="9">9. Sredina -> Lijevo -> U smjeru kazaljke</option>
                        <option value="10">10. Sredina -> Desno -> U smjeru kazaljke</option>
                        <option value="11">11. Sredina -> Gore -> U smjeru kazaljke</option>
                        <option value="12">12. Sredina -> Dolje -> U smjeru kazaljke</option>
                    </optgroup>
                    <optgroup label="Sredina prema van (Suprotno od kazaljke)">
                        <option value="13">13. Sredina -> Lijevo -> Kontra kazaljke</option>
                        <option value="14">14. Sredina -> Desno -> Kontra kazaljke</option>
                        <option value="15">15. Sredina -> Gore -> Kontra kazaljke</option>
                        <option value="16">16. Sredina -> Dolje -> Kontra kazaljke</option>
                    </optgroup>
                </select>

                <button id="generateBtn">KREIRAJ TABLICU</button>
            </div>
        </div>


        <div class="content">
            <div class="vertical-title">IZLAZ</div>
            <div id="matrix-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
